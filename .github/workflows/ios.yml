# Builds an unsigned RepRise.ipa on a macOS runner.
# Sideload it with Sideloadly or AltStore, which sign it with your own Apple ID.
name: iOS app

on:
  push:
    paths:
      - "src/**"
      - "public/**"
      - "ios/**"
      - "index.html"
      - "package*.json"
      - "capacitor.config.ts"
      - "vite.config.ts"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          # Optional: set a repository variable API_BASE (e.g. https://your-app.onrender.com)
          # to turn on the server-side AI features in the iOS app.
          VITE_API_BASE: ${{ vars.API_BASE }}
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
        run: npm run build

      - name: Sync native project
        run: npx cap sync ios

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION=1.0.${{ github.run_number }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 60
          test -d build/Build/Products/Release-iphoneos/App.app

      - name: Package .ipa
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/App.app out/Payload/
          cd out && zip -qry RepRise.ipa Payload && ls -lh RepRise.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: RepRise-ipa
          path: out/RepRise.ipa
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: RepRise iOS build ${{ github.run_number }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: out/RepRise.ipa
          body: |
            Unsigned RepRise build from `${{ github.sha }}`.
            Download **RepRise.ipa** and install it with Sideloadly or AltStore (see README → iPhone app).
