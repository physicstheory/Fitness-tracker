<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RepRise" />
    <meta name="description" content="Track reps, run rest timers, and follow AI-built fitness programs." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>RepRise</title>
    <script>
      // Apply the saved Light/Dark choice before anything paints, so there's no flash.
      try {
        var t = JSON.parse(localStorage.getItem("reprise:v1") || "{}").settings?.theme;
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <style>
      /* Startup splash: shown instantly before the app's JavaScript loads. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(circle at 50% 42%, #2a160f 0%, #0d0f14 62%);
        color: #f4f6fa;
        font-family: "Manrope Variable", system-ui, -apple-system, sans-serif;
        transition: opacity 0.45s ease, transform 0.45s ease;
      }
      :root[data-theme="light"] #splash {
        background: radial-gradient(circle at 50% 42%, #ffe6da 0%, #f3f4f8 62%);
        color: #12151c;
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme="dark"]) #splash {
          background: radial-gradient(circle at 50% 42%, #ffe6da 0%, #f3f4f8 62%);
          color: #12151c;
        }
      }
      #splash.hide {
        opacity: 0;
        transform: scale(1.06);
        pointer-events: none;
      }
      #splash .logo {
        width: 112px;
        height: 112px;
        border-radius: 28px;
        background: linear-gradient(135deg, #ff5a36, #ff9f1c);
        box-shadow: 0 18px 60px rgba(255, 90, 54, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: splash-pop 0.7s cubic-bezier(0.2, 1.4, 0.4, 1) both;
      }
      #splash .flex {
        font-size: 66px;
        line-height: 1;
        display: inline-block;
        transform-origin: 30% 80%;
        animation: splash-flex 0.9s 0.45s ease-in-out both;
      }
      @keyframes splash-flex {
        0%, 100% { transform: rotate(0) scale(1); }
        35% { transform: rotate(-14deg) scale(1.12); }
        65% { transform: rotate(6deg) scale(1.05); }
      }
      #splash .name {
        font-family: "Unbounded Variable", "Manrope Variable", system-ui, sans-serif;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.03em;
        animation: splash-up 0.5s 0.55s ease both;
      }
      #splash .tag {
        margin-top: -10px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #94a0b4;
        animation: splash-up 0.5s 0.75s ease both;
      }
      #splash .pulse {
        position: absolute;
        inset: 0;
        border-radius: 28px;
        border: 2px solid rgba(255, 120, 60, 0.6);
        animation: splash-ring 1.3s 0.5s ease-out both;
      }
      @keyframes splash-pop {
        from { transform: scale(0.4) rotate(-12deg); opacity: 0; }
      }
      @keyframes splash-draw {
        to { stroke-dashoffset: 0; }
      }
      @keyframes splash-up {
        from { transform: translateY(12px); opacity: 0; }
      }
      @keyframes splash-ring {
        from { transform: scale(1); opacity: 1; }
        to { transform: scale(2.4); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div style="position: relative">
      <div class="pulse"></div>
      <div class="logo">
        <span class="flex">💪</span>
      </div>
      </div>
      <div class="name">RepRise</div>
      <div class="tag">Every rep counts</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
